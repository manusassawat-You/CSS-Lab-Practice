<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./02.css" />
    <link rel="stylesheet" href="../all.css" />
    <title>02-Box Model & Layout</title>
  </head>
  <body>
    <section class="book">
      <nav>
        <a href="../00-main/main.html" class="link">⭠กลับหน้าหลัก</a>
      </nav>
      <h1 class="box1">📦Box Model & Layout</h1>
      <h4 class="box2">ลองทำตามภาพให้เหมือนกัน</h4>
      <div class="box3">
        <h2 class="h2">การ์ดพื้นฐาน</h2>
        <div class="in">
          <div class="card">การ์ดของฉัน</div>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">การ์ดที่มีเงา</h2>
        <div class="in">
          <div class="card">
            <p style="color: blueviolet">หัวข้อ</p>
            <p>ข้อความของการ์ด</p>
          </div>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">กล่อง 3 กล่อง</h2>
        <div class="in">
          <div class="row">
            <div class="red">สำคัญ</div>
            <div class="blue">ข้อมูล</div>
            <div class="green">สำเร็จ</div>
          </div>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">กรอบรูป</h2>
        <div class="in center">
          <div class="photo"></div>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">บัตรข้อมูล</h2>
        <div class="in center">
          <div class="info-card">
            <div class="avatar">D</div>
            <div>
              <h4>ชื่อผู้ใช้</h4>
              <p>รายละเอียด</p>
            </div>
          </div>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">กล่อง3กล่อง</h2>
        <div class="in center">
          <div class="tag red">1</div>
          <div class="tag blue">2</div>
          <div class="tag green">3</div>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">ปุ่มพิเศษ</h2>
        <div class="in center">
          <button class="btn">คลิกที่นี่</button>
        </div>
      </div>
      <br />
      <div class="box3">
        <h2 class="h2">การ์ดโปนไฟล์</h2>
        <div class="in center">
          <div class="profile-card">
            <div class="profile-top"></div>
            <div class="avatar1">D</div>
            <div class="profile-bottom">
              <h3>ชื่อของฉัน</h3>
              <p>Dev nest</p>
            </div>
          </div>
        </div>
      </div>
      <br />
    </section>
  </body>
</html>
